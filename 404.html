<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
    <meta charset="UTF-8">
    <!-- Served by ErrorDocument at whatever URL 404'd (e.g. /a/b/c), so pin
         every relative href to the app root before anything else loads. -->
    <script>
        (function () {
            var h = location.hostname;
            var root = (h === 'localhost' || h === '127.0.0.1') ? '/TutorMind/' : '/';
            document.write('<base href="' + root + '">');
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found — TutorMind</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon-new.svg">
    <link rel="icon" type="image/png" href="assets/icons/icon-512.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/tm-tokens.css">
    <link rel="stylesheet" href="assets/css/tm-ds.css">
</head>
<body class="ds-page">
    <script>
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('tutormind-theme'); } catch (e) {}
            if (saved === 'dark') document.body.classList.add('dark-mode');
        })();
    </script>

    <header class="ds-nav">
        <nav class="ds-nav__bar" aria-label="Main">
            <a href="index" class="ds-logo"><img src="assets/logo-bridge.svg" alt="">TutorMind</a>
            <div class="ds-nav__links">
                <a class="ds-nav__link" href="features">Features</a>
                <a class="ds-nav__link" href="index#how-it-works">How it works</a>
                <a class="ds-nav__link" href="login">Log in</a>
            </div>
            <button class="ds-icon-btn" type="button" data-ds-theme aria-label="Dark mode">
                <svg class="ds-i"><use href="#i-moon"/></svg>
            </button>
            <a href="register" class="ds-btn ds-btn--cta ds-btn--sm ds-nav__cta">Start learning <svg class="ds-i ds-i-arrow"><use href="#i-arrow"/></svg></a>
            <button class="ds-icon-btn ds-nav__menu-btn" type="button" data-ds-menu-btn aria-controls="ds-menu" aria-expanded="false" aria-label="Open menu">
                <svg class="ds-i"><use href="#i-menu"/></svg>
            </button>
        </nav>
        <div class="ds-menu" id="ds-menu" hidden>
            <a class="ds-menu__link" href="features">Features <svg class="ds-i"><use href="#i-arrow"/></svg></a>
            <a class="ds-menu__link" href="index#how-it-works">How it works <svg class="ds-i"><use href="#i-arrow"/></svg></a>
            <div class="ds-menu__actions">
                <a href="register" class="ds-btn ds-btn--cta ds-btn--block">Start learning <svg class="ds-i ds-i-arrow"><use href="#i-arrow"/></svg></a>
                <a href="login" class="ds-btn ds-btn--tertiary ds-btn--block">Log in</a>
            </div>
        </div>
    </header>

    <main class="ds-hero ds-error">
        <div class="ds-wrap ds-hero__grid">
            <div class="ds-hero__copy">
                <span class="ds-kicker">Error 404</span>
                <h1 class="ds-h1">This page is a <span class="ds-accent">missing piece.</span></h1>
                <p class="ds-lede">The link might be old, or the address has a typo. Everything else is right where you left it.</p>
                <div class="ds-error__actions">
                    <a href="index" class="ds-btn ds-btn--primary" id="home-btn">Back to home <svg class="ds-i ds-i-arrow"><use href="#i-arrow"/></svg></a>
                    <button type="button" class="ds-btn ds-btn--tertiary" id="back-btn" hidden>Go back</button>
                </div>
            </div>

            <!-- Scene: the register page's keystone arch, built in pairs but one
                 stone short. Pointing at "Back to home" drops the keystone in. -->
            <div class="ds-hero__visual ds-error__visual" data-ds-scene="keystone" aria-hidden="true">
                <div class="ds-hero__fallback"><img src="assets/logo-bridge.svg" alt=""></div>
            </div>
        </div>
    </main>

    <footer class="ds-footer">
        <div class="ds-wrap ds-footer__inner">
            <a href="index" class="ds-logo"><img src="assets/logo-bridge.svg" alt="">TutorMind</a>
            <nav class="ds-footer__links" aria-label="Footer">
                <a href="features">Features</a>
                <a href="index#how-it-works">How it works</a>
                <a href="login">Log in</a>
                <a href="register">Sign up</a>
            </nav>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
    <script src="assets/js/tm-ds.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // tm-ds.js boots on DOMContentLoaded first, so tmScene exists by now (if WebGL does)
            var host = document.querySelector('[data-ds-scene="keystone"]');
            var HOLE = 0.8; // 4 of 5 steps: every pair laid, keystone missing

            function scene(method, arg) {
                if (host.tmScene) host.tmScene[method](arg);
            }

            // Build the arch pair by pair, then stop with the gap at the top
            var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (reduce) scene('setProgress', HOLE);
            else [0.2, 0.4, 0.6, HOLE].forEach(function (v, i) {
                setTimeout(function () { scene('setProgress', v); }, 350 + i * 320);
            });

            // "Back to home" is the missing piece
            var home = document.getElementById('home-btn');
            function fill() { scene('setProgress', 1); }
            function gap() { scene('setProgress', HOLE); }
            ['pointerenter', 'focus'].forEach(function (e) { home.addEventListener(e, fill); });
            ['pointerleave', 'blur'].forEach(function (e) { home.addEventListener(e, gap); });

            // Poking the arch just wobbles it
            host.addEventListener('click', function () { scene('deny'); });

            // Only offer "Go back" when there is somewhere to go back to
            var back = document.getElementById('back-btn');
            if (history.length > 1) {
                back.hidden = false;
                back.addEventListener('click', function () { history.back(); });
            }
        });
    </script>
</body>
</html>
